<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | SweepBird</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
	<style>
	#unity-logo {
    background: url('logo.png') no-repeat center;
    background-size: contain;
    width: 100%;
    max-width: 600px;
    height: 150px;
    margin: 0 auto;
    aspect-ratio: 4 / 1;
  }
  
  @media only screen and (max-width: 768px) {
    #unity-logo {
      max-width: 90vw;
      height: auto;
    }
  }
#unity-progress-bar-empty {
  width: 200px;
  height: 20px;
  background: #333333;
  margin: auto;
  position: relative;
  border: 2px solid white;
  box-sizing: border-box;
}

#unity-progress-bar-full {
  width: 0%;
  height: 100%;
  background: white;
  position: absolute;
  left: 0;
  top: -10px;
  transition: width 0.3s ease;
  box-sizing: border-box;
}

#unity-footer {
  display: none;
}
#custom-text {
		width: 300px;
        text-align: center;
        color: gray;
        font-family: Arial, sans-serif;
        font-size: 13px;
		margin: 0 auto;
        margin-top: 10px;
      }

  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    height: 100%;
    width: 100%;
  }

  #unity-container {
    width: 100%;
    height: 100%;
    position: fixed;
    top: 0;
    left: 0;
  }

  #unity-canvas {
    width: 100%;
    height: 100%;
    display: block;
    background: #231F20;
  }
</style>

  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div id="custom-text">Every day, the Top 10 players win</div>
		<div id="custom-text">a share of $500!</div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">SweepBird</div>
      </div>
    </div>
    <script>

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/sweepbuilds3.loader.js";
      var config = {
        dataUrl: buildUrl + "/sweepbuilds3.data",
        frameworkUrl: buildUrl + "/sweepbuilds3.framework.js",
        codeUrl: buildUrl + "/sweepbuilds3.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Sweep",
        productName: "SweepBird",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                loadingBar.style.display = "none";
                fullscreenButton.onclick = () => {
                  unityInstance.SetFullscreen(1);
                };
              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
